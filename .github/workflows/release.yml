name: Release Straty Kuchnia

# Тег vX.Y.Z → проверки → exe + установщик → GitHub Release в этом репо.
# Программа менеджера смотрит /releases/latest и предлагает обновиться
# (updater.py). Обычный push в main ничего не выпускает.
# Run workflow вручную — пробная сборка без релиза (файлы в Artifacts).

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "flet==0.85.3" "flet-desktop==0.85.3" "flet-cli==0.85.3" "httpx==0.28.1" "openpyxl==3.1.5" "pyinstaller==6.21.0" "tzdata" "Flask>=3.0"

      # Версия из тега обязана совпадать с APP_VERSION в main_kuchnia.py:
      # иначе программа после установки снова увидит «новую» версию и будет
      # обновляться по кругу.
      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $app = (Select-String -Path main_kuchnia.py -Pattern '^APP_VERSION = "(.+)"').Matches[0].Groups[1].Value
          $ref = "${{ github.ref }}"
          if ($ref -like "refs/tags/v*") {
            $v = $ref.Substring("refs/tags/v".Length)
            if ($v -ne $app) {
              Write-Error "Tag v$v nie zgadza się z APP_VERSION = $app w main_kuchnia.py"
              exit 1
            }
          } else {
            $v = $app
          }
          echo "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v"

      # Красный тест = нет релиза
      - name: Tests
        shell: pwsh
        run: |
          foreach ($t in "check_db", "check_server", "check_ui", "check_e2e", "check_checklists", "check_updater") {
            Write-Host "=== $t"
            python "$t.py"
            if ($LASTEXITCODE -ne 0) { Write-Error "$t nie przeszedł"; exit 1 }
          }

      - name: Build exe (PyInstaller)
        run: pyinstaller --noconfirm StratyKuchnia.spec

      # Окно Flet (клиент Flutter) кладёт в сборку хук из flet-cli. Без него
      # exe собирается «успешно», но на кухне при первом запуске качает
      # клиент из интернета, а без сети не открывается вовсе.
      - name: Verify bundle
        shell: pwsh
        run: |
          $app = "dist/StratyKuchnia/_internal/flet_desktop/app"
          if (-not (Test-Path $app)) { Write-Error "Brak klienta Flet w paczce ($app)"; exit 1 }
          $mb = [math]::Round(((Get-ChildItem $app -Recurse -File | Measure-Object Length -Sum).Sum / 1MB), 1)
          Write-Host "Klient Flet: $mb MB"
          if ($mb -lt 50) { Write-Error "Klient Flet podejrzanie mały: $mb MB"; exit 1 }

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          iscc setup.iss /DMyAppVersion=${{ steps.ver.outputs.version }}
          Get-ChildItem Output | Format-Table Name, Length

      - name: Checksums
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item "Output/StratyKuchnia-Setup-$v.exe" artifact/
          $sums = Get-ChildItem artifact -File | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" }
          $sums | Out-File -Encoding ascii artifact/SHA256SUMS.txt
          Get-Content artifact/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: StratyKuchnia-${{ steps.ver.outputs.version }}
          path: artifact/*

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Straty Kuchnia ${{ steps.ver.outputs.version }}
          files: |
            artifact/StratyKuchnia-Setup-${{ steps.ver.outputs.version }}.exe
            artifact/SHA256SUMS.txt
          generate_release_notes: true
          prerelease: ${{ contains(steps.ver.outputs.version, '-') }}
